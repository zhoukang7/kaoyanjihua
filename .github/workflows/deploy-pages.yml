name: Deploy study dashboard

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "deployment-status.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LOGIN_EMAIL_DOMAIN: ${{ vars.LOGIN_EMAIL_DOMAIN }}
        run: |
          test -f index.html
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          cat > _site/config.js <<CONFIG
          window.STUDY_APP_CONFIG = {
            supabaseUrl: "${SUPABASE_URL}",
            supabasePublishableKey: "${SUPABASE_PUBLISHABLE_KEY}",
            loginEmailDomain: "${LOGIN_EMAIL_DOMAIN:-study822.example.com}"
          };
          CONFIG
          echo "Site prepared. Supabase configuration present: $([ -n "$SUPABASE_URL" ] && echo yes || echo no)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{\n  "status": "success",\n  "page_url": "%s",\n  "source_sha": "%s",\n  "deployed_at": "%s"\n}\n' "$PAGE_URL" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment-status.json
          git add deployment-status.json
          git commit -m "Record successful Pages deployment [skip ci]" || exit 0
          git push origin main
