name: Deploy study dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LOGIN_EMAIL_DOMAIN: ${{ vars.LOGIN_EMAIL_DOMAIN }}
        run: |
          set -euo pipefail
          test -f index.html
          test -f comments.js
          test -f comments.css
          test -f task-review.js
          test -f task-review.css
          test -f points-control.js
          test -f points-control.css
          test -f reward-presets.js
          test -f reward-presets.css
          test -f learning-communication.js
          test -f reward-presets-stability.js
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing repository secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing repository secret: SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          mkdir -p _site
          cp index.html comments.js comments.css task-review.js task-review.css points-control.js points-control.css reward-presets.js reward-presets.css learning-communication.js reward-presets-stability.js _site/
          touch _site/.nojekyll
          cat > _site/config.js <<CONFIG
          window.STUDY_APP_CONFIG = {
            supabaseUrl: "${SUPABASE_URL}",
            supabasePublishableKey: "${SUPABASE_PUBLISHABLE_KEY}",
            loginEmailDomain: "${LOGIN_EMAIL_DOMAIN:-study822.example.com}"
          };

          (() => {
            ["comments.css", "task-review.css", "points-control.css", "reward-presets.css"].forEach((href) => {
              const stylesheet = document.createElement("link");
              stylesheet.rel = "stylesheet";
              stylesheet.href = "./" + href;
              document.head.appendChild(stylesheet);
            });

            [
              "comments.js",
              "task-review.js",
              "points-control.js",
              "reward-presets.js",
              "learning-communication.js",
              "reward-presets-stability.js"
            ].forEach((src) => {
              const script = document.createElement("script");
              script.src = "./" + src;
              script.async = false;
              document.head.appendChild(script);
            });
          })();
          CONFIG
          echo "Static site prepared successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
