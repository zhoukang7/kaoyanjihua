name: Deploy study dashboard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare CSP-protected static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LOGIN_EMAIL_DOMAIN: ${{ vars.LOGIN_EMAIL_DOMAIN }}
        run: |
          set -euo pipefail
          test -f package.json
          test -f scripts/prepare-static-site.mjs
          test -f scripts/build-site.mjs
          test -f scripts/add-math-daily-tasks.mjs
          test -f scripts/add-point-reason-presets.mjs
          test -f scripts/improve-points-deduction-guidance.mjs
          test -f daily-task-settings.js
          test -f daily-task-settings.css
          test -f points-reason-presets.js
          test -f points-reason-presets.css
          test -f supabase-daily-task-settings.sql
          test -f supabase-add-math-daily-tasks.sql
          test -f supabase-manual-points.sql
          test -f supabase-manual-deductions.sql

          SUPABASE_JS_VERSION="$(node -p "require('./package.json').dependencies['@supabase/supabase-js']")"
          if ! printf '%s' "$SUPABASE_JS_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::@supabase/supabase-js must use an exact semantic version"
            exit 1
          fi

          rm -rf .vendor-cache _site
          mkdir -p .vendor-cache
          TARBALL="$(npm pack "@supabase/supabase-js@$SUPABASE_JS_VERSION" --ignore-scripts --silent --pack-destination .vendor-cache)"
          tar -xzf ".vendor-cache/$TARBALL" -C .vendor-cache

          node scripts/prepare-static-site.mjs
          node scripts/add-math-daily-tasks.mjs
          node scripts/add-point-reason-presets.mjs
          node scripts/improve-points-deduction-guidance.mjs

          test -s _site/vendor/supabase.js
          test -s _site/assets/app.css
          test -s _site/assets/app.js
          test -s _site/daily-task-settings.js
          test -s _site/daily-task-settings.css
          test -s _site/points-reason-presets.js
          test -s _site/points-reason-presets.css
          test -s _site/points-deduction.js
          node --check _site/assets/app.js
          node --check _site/config.js
          node --check _site/task-review.js
          node --check _site/daily-task-settings.js
          node --check _site/points-reason-presets.js
          node --check _site/points-deduction.js
          grep -Fq 'http-equiv="Content-Security-Policy"' _site/index.html
          grep -Fq 'src="./vendor/supabase.js"' _site/index.html
          grep -Fq 'href="./assets/app.css"' _site/index.html
          grep -Fq 'src="./assets/app.js"' _site/index.html
          grep -Fq 'daily-task-settings.js' _site/config.js
          grep -Fq 'daily-task-settings.css' _site/config.js
          grep -Fq 'points-reason-presets.js' _site/config.js
          grep -Fq 'points-reason-presets.css' _site/config.js
          grep -Fq 'window.STUDY_DAILY_TASKS' _site/assets/app.js
          grep -Fq 'dailyApplied' _site/assets/app.js
          grep -Fq "d_linear" _site/assets/app.js
          grep -Fq "d_probability" _site/assets/app.js
          grep -Fq "math_l" _site/daily-task-settings.js
          grep -Fq "math_p" _site/daily-task-settings.js
          grep -Fq "d_linear" _site/task-review.js
          grep -Fq "d_probability" _site/task-review.js
          grep -Fq 'update_daily_task_config' _site/daily-task-settings.js
          grep -Fq '每日任务完成' _site/points-reason-presets.js
          grep -Fq '每日学习量等效' _site/points-reason-presets.js
          grep -Fq 'manualGrantNote' _site/points-reason-presets.js
          grep -Fq 'supabase-manual-deductions.sql' _site/points-deduction.js
          grep -Fq 'deduct_user_points' _site/points-deduction.js
          grep -Fq 'create or replace function public.deduct_user_points' supabase-manual-deductions.sql
          grep -Fq 'grant execute on function public.deduct_user_points(integer, text) to authenticated' supabase-manual-deductions.sql
          echo "Static site prepared with editable math daily tasks, point grant presets, deduction RPC migration guidance, progress snapshots, local Supabase JS $SUPABASE_JS_VERSION, shared auth client, extracted assets, and CSP."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
